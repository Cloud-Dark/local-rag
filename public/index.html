<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAG Lokal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 760px; margin: 0 auto; padding: 24px;
      background: #f8f7f4; color: #1a1a1a;
    }

    /* Tabs */
    .tabs { display: flex; border-bottom: 1.5px solid #1a1a1a; margin-bottom: 24px; gap: 0; }
    .tab {
      padding: 10px 20px; cursor: pointer; border: 1.5px solid transparent;
      background: none; font-size: 0.85rem; color: #666;
      border-bottom: none; margin-bottom: -1.5px;
      font-weight: 500; letter-spacing: 0.02em;
    }
    .tab:hover { color: #1a1a1a; background: #f0efe8; }
    .tab.active {
      color: #1a1a1a; border-color: #1a1a1a; background: white;
      font-weight: 600; border-bottom-color: white;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card {
      background: white; border: 1.5px solid #1a1a1a;
      padding: 20px; margin-bottom: 16px;
    }
    .card h3 {
      font-size: 0.75rem; color: #888; text-transform: uppercase;
      letter-spacing: 0.08em; margin-bottom: 14px; font-weight: 600;
    }
    .card-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 14px;
    }
    .card-header h3 { margin: 0; }

    label { display: block; font-size: 0.78rem; color: #555; margin-bottom: 5px; font-weight: 500; }
    textarea {
      width: 100%; padding: 10px; border: 1.5px solid #ddd;
      font-size: 0.9rem; font-family: inherit; resize: vertical;
      min-height: 100px; background: #fcfcfa;
    }
    textarea:focus { outline: none; border-color: #1a1a1a; }
    input[type="text"], input[type="url"] {
      width: 100%; padding: 10px; border: 1.5px solid #ddd;
      font-size: 0.9rem; background: #fcfcfa;
    }
    input:focus { outline: none; border-color: #1a1a1a; }
    select {
      padding: 8px 10px; border: 1.5px solid #ddd;
      font-size: 0.85rem; background: #fcfcfa;
    }

    .row { display: flex; gap: 8px; margin-top: 12px; }
    .row > *:first-child { flex: 1; }

    button {
      background: #1a1a1a; color: white; border: 1.5px solid #1a1a1a;
      padding: 10px 20px; cursor: pointer; font-size: 0.82rem;
      font-weight: 500; letter-spacing: 0.02em;
    }
    button:hover { background: #333; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.secondary { background: white; color: #1a1a1a; }
    button.secondary:hover { background: #f0efe8; }
    button.danger { background: white; color: #c00; border-color: #c00; }
    button.danger:hover { background: #fff0f0; }
    button.small { padding: 5px 10px; font-size: 0.75rem; }
    button.link {
      background: none; border: none; color: #1a1a1a;
      text-decoration: underline; padding: 2px 4px;
    }
    button.link:hover { background: none; color: #555; }

    input[type="file"] { margin-top: 6px; font-size: 0.85rem; }

    /* Items list (urls, files) */
    .items { margin-top: 10px; }
    .item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 10px; background: #f6f5f0; border: 1px solid #eae8e0;
      margin-bottom: 5px; font-size: 0.82rem; gap: 8px;
    }
    .item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item .actions { display: flex; gap: 4px; flex-shrink: 0; }
    .item button { padding: 3px 8px; font-size: 0.7rem; min-width: 24px; }

    /* Status / Alert */
    .alert {
      margin-top: 10px; padding: 10px 12px; font-size: 0.8rem;
      border: 1.5px solid;
    }
    .alert.success { background: #edfaf0; border-color: #1a7a3a; color: #1a5a2a; }
    .alert.error { background: #fef2f2; border-color: #c00; color: #8a1a1a; }
    .alert.loading { background: #f0f4ff; border-color: #3366cc; color: #1a3366; }

    /* Search results */
    .result { padding: 14px 0; border-bottom: 1px solid #eae8e0; }
    .result:last-child { border-bottom: none; }
    .result .score { font-size: 0.75rem; color: #888; margin-bottom: 5px; font-weight: 500; }
    .result .text { font-size: 0.88rem; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
    .result .meta { font-size: 0.73rem; color: #888; }
    .result .meta a { color: #1a1a1a; text-decoration: underline; }

    /* Document list */
    .doc-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px; background: #f6f5f0; border: 1px solid #eae8e0;
      margin-bottom: 6px;
    }
    .doc-info { flex: 1; min-width: 0; }
    .doc-name { font-size: 0.88rem; color: #1a1a1a; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .doc-meta { font-size: 0.72rem; color: #888; margin-top: 4px; display: flex; flex-wrap: wrap; gap: 8px; }
    .doc-actions { display: flex; gap: 4px; flex-shrink: 0; margin-left: 8px; }

    /* Empty state */
    .empty { text-align: center; padding: 40px 20px; color: #999; }
    .empty-icon { font-size: 1.8rem; margin-bottom: 8px; }

    /* Modal */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.4); display: flex; justify-content: center;
      align-items: center; z-index: 1000;
    }
    .modal {
      background: white; border: 1.5px solid #1a1a1a;
      padding: 24px; max-width: 760px; width: 92%;
      max-height: 80vh; overflow-y: auto;
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px;
    }
    .modal-header h3 { margin: 0; font-size: 1rem; }
    .modal-close {
      background: none; border: none; font-size: 1.3rem;
      cursor: pointer; color: #999; padding: 2px 8px; line-height: 1;
    }
    .modal-close:hover { color: #1a1a1a; }
    .modal-body {
      background: #f8f7f4; border: 1px solid #eae8e0;
      padding: 16px; white-space: pre-wrap; font-family: monospace;
      font-size: 0.82rem; line-height: 1.5; max-height: 55vh; overflow-y: auto;
    }
    .modal-footer { margin-top: 14px; display: flex; gap: 8px; justify-content: flex-end; }

    /* Search config */
    .search-config {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
      margin-top: 12px; padding: 12px; background: #f6f5f0;
      border: 1px solid #eae8e0;
    }
    .search-config label { margin-bottom: 2px; }
    .search-config input[type="range"] { width: 100px; vertical-align: middle; }
    .search-config .value { font-size: 0.8rem; font-weight: 600; min-width: 28px; display: inline-block; }

    /* Badge tags */
    .badge { display: inline-block; font-size: 0.65rem; padding: 2px 6px; background: #eae8e0; font-weight: 500; letter-spacing: 0.03em; }

    @media (max-width: 600px) {
      body { padding: 12px; }
      .tabs { gap: 0; }
      .tab { padding: 8px 12px; font-size: 0.78rem; }
      .search-config { flex-direction: column; align-items: stretch; }
      .doc-actions { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('training')">Train</button>
    <button class="tab" onclick="switchTab('list')">Documents</button>
    <button class="tab" onclick="switchTab('search')">Search</button>
    <button class="tab" onclick="switchTab('agent')">API</button>
  </div>

  <!-- ════════ TRAINING TAB ════════ -->
  <div id="training" class="tab-content active">

    <!-- Direct Text -->
    <div class="card">
      <h3>1. Text</h3>
      <textarea id="textInput" placeholder="Paste your text here..."></textarea>
      <div class="row">
        <input type="url" id="textSourceUrl" placeholder="Source URL (optional)">
        <button class="secondary" onclick="addTextSourceUrl()">Add</button>
      </div>
      <div class="items" id="textSourceUrlList"></div>
      <div class="row">
        <button onclick="trainText()" id="trainTextBtn">Train Text</button>
      </div>
      <div id="textStatus"></div>
    </div>

    <!-- File Upload -->
    <div class="card">
      <h3>2. Files</h3>
      <input type="file" id="fileInput" multiple accept=".pdf,.txt,.md,.docx,.xlsx,.xls,.pptx,.csv">
      <div class="items" id="fileList"></div>
      <div class="row" style="margin-top: 8px;">
        <input type="url" id="fileSourceUrl" placeholder="Source URL (applied to all files, optional)">
      </div>
      <div class="row">
        <button onclick="trainFiles()" id="trainFileBtn">Train Files</button>
      </div>
      <div id="fileStatus"></div>
    </div>

    <!-- URL Fetch -->
    <div class="card">
      <h3>3. URLs</h3>
      <div class="row">
        <input type="url" id="urlInput" placeholder="https://example.com/article">
        <button class="secondary" onclick="addUrl()">Add</button>
      </div>
      <div class="items" id="urlList"></div>
      <div class="row">
        <button onclick="trainUrls()" id="trainUrlBtn">Train URLs</button>
      </div>
      <div id="urlStatus"></div>
    </div>

  </div>

  <!-- ════════ DOCUMENTS TAB ════════ -->
  <div id="list" class="tab-content">
    <div class="card">
      <div class="card-header">
        <h3>Documents</h3>
        <div style="display: flex; gap: 6px;">
          <button class="secondary small" onclick="retrainAll()" id="retrainAllBtn" title="Retrain all documents">↻ Retrain All</button>
          <button class="secondary small" onclick="loadDocuments()">↻ Refresh</button>
        </div>
      </div>
      <div id="docList"></div>
      <div id="docEmpty" class="empty">
        <div class="empty-icon">📄</div>
        <div>No documents trained yet</div>
      </div>
    </div>
  </div>

  <!-- ════════ AGENT TAB ════════ -->
  <div id="agent" class="tab-content">
    <div class="card">
      <div class="card-header"><h3>API Documentation for AI Agents</h3></div>
      <p style="font-size:0.85rem;color:#555;margin-bottom:14px;line-height:1.6;">
        Copy the markdown below and paste it into any AI assistant (Claude, ChatGPT, etc.)
        so it understands how to interact with this RAG API.
      </p>
      <button onclick="copyApiDoc()" style="margin-bottom:12px;">📋 Copy API Docs</button>
      <pre id="agentDoc" style="
        background:#f6f5f0; border:1px solid #eae8e0;
        padding:16px; font-family:monospace; font-size:0.78rem;
        line-height:1.5; white-space:pre-wrap; max-height:65vh; overflow-y:auto;
      "></pre>
    </div>
  </div>

  <!-- ════════ SEARCH TAB ════════ -->
  <div id="search" class="tab-content">
    <div class="card">
      <h3>Search</h3>
      <div class="row">
        <input type="text" id="searchInput" placeholder="Ask a question...">
        <button onclick="search()">Search</button>
      </div>

      <div class="search-config">
        <div>
          <label>Mode</label>
          <select id="searchType" onchange="onSearchTypeChange()">
            <option value="hybrid">Hybrid</option>
            <option value="vector">Vector</option>
            <option value="keyword">Keyword</option>
          </select>
        </div>
        <div id="alphaGroup">
          <label>Alpha <span id="alphaValue">0.70</span></label>
          <input type="range" id="alphaSlider" min="0" max="1" step="0.05" value="0.7"
                 oninput="document.getElementById('alphaValue').textContent=parseFloat(this.value).toFixed(2)">
        </div>
        <div>
          <label>Results</label>
          <select id="topKSelect">
            <option value="3">3</option>
            <option value="5" selected>5</option>
            <option value="10">10</option>
            <option value="20">20</option>
          </select>
        </div>
        <div>
          <label>Min Score <span id="minScoreValue">0.00</span></label>
          <input type="range" id="minScoreSlider" min="0" max="1" step="0.05" value="0"
                 oninput="document.getElementById('minScoreValue').textContent=parseFloat(this.value).toFixed(2)">
        </div>
      </div>

      <div id="results" style="margin-top: 16px;"></div>
    </div>
  </div>

  <script>
    const API = window.location.origin + '/api';
    let files = [];
    let urls = [];
    let textSourceUrls = [];

    // ─── Tab Switching ───
    function switchTab(tabId) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      const tab = document.querySelector(`.tab[onclick*="'${tabId}'"]`);
      if (tab) tab.classList.add('active');
      document.getElementById(tabId).classList.add('active');
      if (tabId === 'list') loadDocuments();
    }

    // ─── Search type change ───
    function onSearchTypeChange() {
      const show = document.getElementById('searchType').value === 'hybrid';
      document.getElementById('alphaGroup').style.display = show ? '' : 'none';
    }
    onSearchTypeChange();

    // ─── Text Source URLs ───
    function addTextSourceUrl() {
      const input = document.getElementById('textSourceUrl');
      const url = input.value.trim();
      if (url && isValidUrl(url)) { textSourceUrls.push(url); renderTextSourceUrls(); input.value = ''; }
    }
    function renderTextSourceUrls() {
      document.getElementById('textSourceUrlList').innerHTML =
        textSourceUrls.map((u, i) => `<div class="item"><span class="name">${esc(u)}</span><div class="actions"><button onclick="textSourceUrls.splice(${i},1);renderTextSourceUrls()">✕</button></div></div>`).join('');
    }
    function removeTextSourceUrl(i) { textSourceUrls.splice(i,1); renderTextSourceUrls(); }

    // ─── File handling ───
    document.getElementById('fileInput').addEventListener('change', e => {
      files = [...e.target.files];
      renderFiles();
    });
    function renderFiles() {
      const list = document.getElementById('fileList');
      const formats = {
        pdf: '📄', docx: '📋', xlsx: '📊', xls: '📊', pptx: '📽️',
        csv: '📊', txt: '📝', md: '📝'
      };
      list.innerHTML = files.map((f, i) => {
        const ext = f.name.split('.').pop().toLowerCase();
        const icon = formats[ext] || '📄';
        return `<div class="item"><span class="name">${icon} ${esc(f.name)}</span><div class="actions"><button onclick="files.splice(${i},1);renderFiles();document.getElementById('fileInput').value=''">✕</button></div></div>`;
      }).join('');
    }
    function removeFile(i) { files.splice(i,1); renderFiles(); document.getElementById('fileInput').value = ''; }

    // ─── URL handling ───
    function addUrl() {
      const input = document.getElementById('urlInput');
      const url = input.value.trim();
      if (url && isValidUrl(url)) { urls.push(url); renderUrls(); input.value = ''; }
    }
    function renderUrls() {
      document.getElementById('urlList').innerHTML =
        urls.map((u, i) => `<div class="item"><span class="name">🌐 ${esc(u)}</span><div class="actions"><button onclick="urls.splice(${i},1);renderUrls()">✕</button></div></div>`).join('');
    }
    function removeUrl(i) { urls.splice(i,1); renderUrls(); }

    function isValidUrl(s) { try { new URL(s); return true; } catch { return false; } }

    // ─── Train Text ───
    async function trainText() {
      const text = document.getElementById('textInput').value.trim();
      if (!text) { return showStatus('textStatus', 'Enter some text', 'error'); }

      const btn = document.getElementById('trainTextBtn'); btn.disabled = true;
      showStatus('textStatus', 'Training...', 'loading');

      const fd = new FormData();
      fd.append('text', text);
      const allUrls = [...textSourceUrls];
      const inputUrl = document.getElementById('textSourceUrl').value.trim();
      if (inputUrl && isValidUrl(inputUrl)) allUrls.push(inputUrl);
      if (allUrls.length) fd.append('sourceUrls', JSON.stringify(allUrls));

      try {
        const res = await fetch(`${API}/training`, { method: 'POST', body: fd });
        const r = await res.json();
        if (r.success) {
          showStatus('textStatus', `Done! ${r.processed.length} items, ${r.totalChunksInDB} chunks in DB`, 'success');
          document.getElementById('textInput').value = '';
          document.getElementById('textSourceUrl').value = '';
          textSourceUrls = []; renderTextSourceUrls();
        } else showStatus('textStatus', r.error || 'Failed', 'error');
      } catch (e) { showStatus('textStatus', e.message, 'error'); }
      btn.disabled = false;
    }

    // ─── Train Files ───
    async function trainFiles() {
      if (!files.length) return showStatus('fileStatus', 'Select files first', 'error');
      const btn = document.getElementById('trainFileBtn'); btn.disabled = true;
      showStatus('fileStatus', 'Training...', 'loading');

      const fd = new FormData();
      files.forEach(f => fd.append('files', f));
      const fileSourceUrl = document.getElementById('fileSourceUrl').value.trim();
      if (fileSourceUrl && isValidUrl(fileSourceUrl)) fd.append('sourceUrls', JSON.stringify([fileSourceUrl]));

      try {
        const res = await fetch(`${API}/training`, { method: 'POST', body: fd });
        const r = await res.json();
        if (r.success) {
          showStatus('fileStatus', `Done! ${r.processed.length} items, ${r.totalChunksInDB} chunks`, 'success');
          files = []; renderFiles();
          document.getElementById('fileInput').value = '';
        } else showStatus('fileStatus', r.error || 'Failed', 'error');
      } catch (e) { showStatus('fileStatus', e.message, 'error'); }
      btn.disabled = false;
    }

    // ─── Train URLs ───
    async function trainUrls() {
      if (!urls.length) return showStatus('urlStatus', 'Add URLs first', 'error');
      const btn = document.getElementById('trainUrlBtn'); btn.disabled = true;
      showStatus('urlStatus', 'Training...', 'loading');

      const fd = new FormData();
      fd.append('urls', JSON.stringify(urls));

      try {
        const res = await fetch(`${API}/training`, { method: 'POST', body: fd });
        const r = await res.json();
        if (r.success) {
          showStatus('urlStatus', `Done! ${r.processed.length} items, ${r.totalChunksInDB} chunks`, 'success');
          urls = []; renderUrls();
        } else showStatus('urlStatus', r.error || 'Failed', 'error');
      } catch (e) { showStatus('urlStatus', e.message, 'error'); }
      btn.disabled = false;
    }

    function showStatus(id, msg, type) {
      const el = document.getElementById(id);
      el.className = `alert ${type}`;
      el.textContent = msg;
    }

    // ─── Load Documents ───
    async function loadDocuments() {
      const list = document.getElementById('docList');
      const empty = document.getElementById('docEmpty');

      try {
        const res = await fetch(`${API}/get-list`);
        const data = await res.json();

        if (data.documents && data.documents.length) {
          empty.style.display = 'none';
          const modelShort = data.embeddingModel ? data.embeddingModel.split('/').pop() : '';
          list.innerHTML = `
            <div style="margin-bottom: 10px; font-size: 0.78rem; color: #888;">
              ${data.totalChunks} chunks · ${data.totalDocuments} docs
              ${modelShort ? '· ' + esc(modelShort) : ''}
            </div>
            ${data.documents.map(doc => {
              const urls = doc.sourceUrl ? (Array.isArray(doc.sourceUrl) ? doc.sourceUrl : [doc.sourceUrl]) : [];
              const sourceLinks = urls.map(u => `<a href="${u}" target="_blank" style="margin-left:4px;color:#888;text-decoration:none;">↗</a>`).join('');
              const icon = doc.isUrl ? '🌐' : '📄';
              const modelName = (doc.modelName || '').split('/').pop() || 'Unknown';
              return `<div class="doc-item">
                <div class="doc-info">
                  <div class="doc-name">${icon} ${esc(doc.fileName)} ${sourceLinks}</div>
                  <div class="doc-meta">
                    <span>${doc.chunks} chunks</span>
                    <span>Created: ${fmtDate(doc.createdDate)}</span>
                    ${doc.lastRetrainedAt ? `<span>Retrained: ${fmtDate(doc.lastRetrainedAt)}</span>` : ''}
                    <span>${esc(modelName)}</span>
                  </div>
                </div>
                <div class="doc-actions">
                  ${!doc.isUrl ? `<button class="small link" onclick="viewDoc('${escAttr(doc.fileName)}')">View</button>` : ''}
                  ${doc.isUrl ? `<button class="small link" onclick="viewText('${escAttr(doc.fileName)}')">Text</button>` : ''}
                  <button class="small link" onclick="retrainDoc('${escAttr(doc.fileName)}')">↻</button>
                  <button class="danger small" onclick="deleteDoc('${escAttr(doc.fileName)}')">Delete</button>
                </div>
              </div>`;
            }).join('')}
          `;
        } else {
          empty.style.display = 'block';
          list.innerHTML = '';
        }
      } catch (e) {
        list.innerHTML = `<div style="color:#c00;padding:16px;">Error: ${esc(e.message)}</div>`;
      }
    }

    // ─── Delete Document ───
    async function deleteDoc(fileName) {
      if (!confirm(`Delete "${fileName}"?`)) return;
      try {
        const res = await fetch(`${API}/reset?filesOnly=true&fileName=${encodeURIComponent(fileName)}`, { method: 'DELETE' });
        const r = await res.json();
        if (r.success) loadDocuments(); else alert(r.message || 'Failed');
      } catch (e) { alert('Error: ' + e.message); }
    }

    // ─── Search ───
    async function search() {
      const query = document.getElementById('searchInput').value.trim();
      const results = document.getElementById('results');
      if (!query) return;

      const searchType = document.getElementById('searchType').value;
      const topK = parseInt(document.getElementById('topKSelect').value);
      const minScore = parseFloat(document.getElementById('minScoreSlider').value);
      const alpha = parseFloat(document.getElementById('alphaSlider').value);

      results.innerHTML = '<div style="color:#999;padding:16px 0;">Searching...</div>';

      try {
        const body = { query, topK, searchType, minScore };
        if (searchType === 'hybrid') body.alpha = alpha;

        const res = await fetch(`${API}/search`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();

        if (data.results && data.results.length) {
          results.innerHTML = `
            <div style="font-size:0.78rem;color:#888;margin-bottom:12px;">
              ${data.results.length} results · ${searchType} · threshold ${(data.minScore * 100).toFixed(0)}%
              ${data.bestScore !== null ? `· best ${(data.bestScore * 100).toFixed(0)}%` : ''}
              ${data.filteredOut ? `· ${data.filteredOut} filtered` : ''}
            </div>
            ${data.results.map(r => {
              const urls = r.sourceUrl ? (Array.isArray(r.sourceUrl) ? r.sourceUrl : [r.sourceUrl]) : [];
              const sourceHtml = urls.length
                ? `<div class="meta" style="margin-top:6px;">Sources: ${urls.map((u,i) => `<a href="${u}" target="_blank">[${i+1}] ${new URL(u).hostname}</a>`).join(' ')}</div>`
                : '';
              const fileLink = r.fileUrl && !urls.length
                ? `<div class="meta"><a href="${r.fileUrl}" target="_blank">Download: ${esc(r.fileName)}</a></div>`
                : '';
              const scores = [];
              if (r.vectorScore !== undefined) scores.push(`vec ${(r.vectorScore * 100).toFixed(0)}`);
              if (r.keywordScore !== undefined) scores.push(`kw ${(r.keywordScore * 100).toFixed(0)}`);
              if (r.hybridScore !== undefined) scores.push(`hybrid ${(r.hybridScore * 100).toFixed(0)}`);
              const scoreStr = scores.length ? ` · ${scores.join(' · ')}` : '';

              return `<div class="result">
                <div class="score">${(r.score * 100).toFixed(0)}% · ${esc(r.fileName)}${scoreStr}</div>
                <div class="text">${esc(r.text)}</div>
                ${sourceHtml}${fileLink}
              </div>`;
            }).join('')}
          `;
        } else {
          const msg = data.bestScore !== null
            ? `No relevant results. Best candidate was ${(data.bestScore * 100).toFixed(0)}%, below ${(data.minScore * 100).toFixed(0)}% threshold.`
            : 'No relevant results found.';
          results.innerHTML = `<div style="color:#999;padding:16px 0;">${msg}</div>`;
        }
      } catch (e) {
        results.innerHTML = `<div style="color:#c00;padding:16px 0;">Error: ${esc(e.message)}</div>`;
      }
    }

    // ─── View file ───
    function viewDoc(fileName) {
      window.open(`${API}/file/${encodeURIComponent(fileName)}`, '_blank');
    }

    // ─── View text content (modal) ───
    async function viewText(fileName) {
      try {
        const res = await fetch(`${API}/text/${encodeURIComponent(fileName)}`);
        const data = await res.json();
        if (!data.success) { alert('Failed: ' + data.error); return; }

        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.innerHTML = `
          <div class="modal">
            <div class="modal-header">
              <h3>📝 ${esc(fileName)}</h3>
              <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">×</button>
            </div>
            <div style="font-size:0.78rem;color:#888;margin-bottom:10px;">
              ${data.totalChunks} chunks · ${data.fullText.length.toLocaleString()} chars
            </div>
            <div class="modal-body">${esc(data.fullText)}</div>
            <div class="modal-footer">
              <button onclick="navigator.clipboard.writeText(\`${data.fullText.replace(/`/g,'\\`').replace(/\$/g,'\\$')}\`);alert('Copied!')">📋 Copy</button>
              <button class="secondary" onclick="this.closest('.modal-overlay').remove()">Close</button>
            </div>
          </div>
        `;
        document.body.appendChild(overlay);
      } catch (e) { alert('Error: ' + e.message); }
    }

    // ─── Retrain single ───
    async function retrainDoc(fileName) {
      if (!confirm(`Retrain "${fileName}" with current embedding model?`)) return;
      try {
        const res = await fetch(`${API}/retrain`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fileName }),
        });
        const r = await res.json();
        if (r.success) {
          alert(`Retrain done! ${r.chunks} chunks with ${r.modelName.split('/').pop()}`);
          loadDocuments();
        } else alert('Failed: ' + r.error);
      } catch (e) { alert('Error: ' + e.message); }
    }

    // ─── Retrain all ───
    async function retrainAll() {
      if (!confirm('Retrain ALL documents with current model?\nThis will delete and re-index everything.')) return;
      const btn = document.getElementById('retrainAllBtn');
      btn.disabled = true;
      btn.textContent = '⏳';
      try {
        const res = await fetch(`${API}/retrain-all`, { method: 'POST', headers: { 'Content-Type': 'application/json' } });
        const r = await res.json();
        if (r.success) {
          alert(`Retrain all done! ${r.totalDocuments} docs, ${r.totalChunks} chunks${r.failed ? ', ' + r.failed + ' failed' : ''}`);
          loadDocuments();
        } else alert('Failed: ' + r.error);
      } catch (e) { alert('Error: ' + e.message); }
      btn.disabled = false;
      btn.textContent = '↻ Retrain All';
    }

    // ─── Helpers ───
    const API_DOC = document.getElementById('agentDoc');
    if (API_DOC) {
      // Load API docs from agent.md so the content stays in sync
      fetch('/agent.md')
        .then(r => r.text())
        .then(md => { API_DOC.textContent = md; })
        .catch(() => {
          API_DOC.textContent = 'Failed to load API docs. Open /agent.md directly.';
        });
    }

    function esc(t) {
      const d = document.createElement('div'); d.textContent = t; return d.innerHTML;
    }
    function escAttr(t) { return esc(t).replace(/'/g, '&apos;'); }
    function copyApiDoc() {
      const text = document.getElementById('agentDoc').textContent;
      navigator.clipboard.writeText(text).then(() => alert('API docs copied!')).catch(() => {
        // Fallback
        const ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta);
        alert('API docs copied!');
      });
    }
    function fmtDate(s) {
      if (!s) return 'N/A';
      return new Date(s).toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
    }
  </script>
</body>
</html>
